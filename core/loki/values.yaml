# Single-binary Loki for a 3-node kind cluster.
# - Filesystem storage (no MinIO/S3) — local-path PVC, 10Gi, 7d retention.
# - Auth disabled (single-tenant homelab; Grafana hits Loki directly).
# - kube-prometheus-stack's Grafana registers Loki as a datasource via the
#   `loki-gateway` Service (see core/monitoring/values.yaml).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    retention_period: 168h     # 7d
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  ruler:
    enable_api: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    # storageClass omitted → uses kind's default `standard` (local-path)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Disable the scaled-out components — single-binary mode only.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Gateway is the single push/query endpoint everything else hits.
gateway:
  enabled: true
  replicas: 1

# Object-store caches are pointless on filesystem storage.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Bundled MinIO not needed — we're on local filesystem.
minio:
  enabled: false

# Disable the canary and test pod — noise for a homelab.
lokiCanary:
  enabled: false
test:
  enabled: false
