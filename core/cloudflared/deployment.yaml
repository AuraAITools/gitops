# cloudflared — Cloudflare Tunnel daemon. Makes outbound connections to
# Cloudflare's edge; no inbound ports, no LoadBalancer Service required.
# Routes traffic from configured public hostnames (managed in Cloudflare
# dashboard) into the cluster via in-cluster DNS to the Istio ingress gateway.
#
# Tunnel ingress rules are NOT in this repo — they're managed in the
# Cloudflare dashboard for the tunnel this token belongs to. Each public
# hostname points at:
#   service: http://istio-ingressgateway.istio-ingress.svc.cluster.local:80
# (the gateway then routes by Host header via VirtualService).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2  # two replicas = transparent rolling updates + survives single pod failure
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # TUNNEL_TOKEN is created imperatively from the token Cloudflare
            # generates when you create a new tunnel. See README.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
