prometheus:
  prometheusSpec:
    # Discover PodMonitor/ServiceMonitor across all namespaces, not just
    # those carrying the chart's release labels.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 24h
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi

  # Scrape Istio sidecar (envoy) metrics — port 15090 /stats/prometheus
  additionalPodMonitors:
    - name: envoy-stats
      namespaceSelector:
        any: true
      selector:
        matchExpressions:
          - { key: istio-prometheus-ignore, operator: DoesNotExist }
      podMetricsEndpoints:
        - path: /stats/prometheus
          interval: 15s
          relabelings:
            - action: keep
              sourceLabels: [__meta_kubernetes_pod_container_name]
              regex: istio-proxy

  # Scrape istiod control plane
  additionalServiceMonitors:
    - name: istiod
      namespaceSelector:
        matchNames: [istio-system]
      selector:
        matchLabels:
          istio: pilot
      endpoints:
        - port: http-monitoring
          interval: 15s

grafana:
  adminPassword: admin   # rotate after first login
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      # ConfigMaps carrying this label get auto-loaded as dashboards.
      # The dashboards listed under `grafana.dashboards.*` below are rendered
      # into ConfigMaps with this label automatically by the grafana subchart.
      label: grafana_dashboard
      searchNamespace: ALL

  # Canonical Istio dashboards, fetched at helm-template time from the
  # release-1.30 branch (matches our pinned Istio version — bump together).
  # Source: github.com/istio/istio/tree/release-1.30/manifests/addons/dashboards
  dashboards:
    istio:
      istio-mesh:
        url: https://raw.githubusercontent.com/istio/istio/release-1.30/manifests/addons/dashboards/istio-mesh-dashboard.gen.json
        datasource: Prometheus
      istio-service:
        url: https://raw.githubusercontent.com/istio/istio/release-1.30/manifests/addons/dashboards/istio-service-dashboard.json
        datasource: Prometheus
      istio-workload:
        url: https://raw.githubusercontent.com/istio/istio/release-1.30/manifests/addons/dashboards/istio-workload-dashboard.json
        datasource: Prometheus
      istio-performance:
        url: https://raw.githubusercontent.com/istio/istio/release-1.30/manifests/addons/dashboards/istio-performance-dashboard.json
        datasource: Prometheus
      istio-control-plane:
        url: https://raw.githubusercontent.com/istio/istio/release-1.30/manifests/addons/dashboards/pilot-dashboard.gen.json
        datasource: Prometheus
      istio-extension:
        url: https://raw.githubusercontent.com/istio/istio/release-1.30/manifests/addons/dashboards/istio-extension-dashboard.json
        datasource: Prometheus

  # Group the imported dashboards under an "Istio" folder in the UI.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: istio
          orgId: 1
          folder: Istio
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/istio

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi

# k3d/k3s ships an embedded etcd and replaces kube-proxy with klipper —
# scraping the chart's defaults would just give DOWN targets and noisy alerts.
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
