global:
  domain: argocd.lab.lan

configs:
  params:
    server.insecure: true
    application.namespaces: "argocd,apps-*"
    # Source Hydrator (alpha in 3.4.3) — renders DRY sources to environments/<env>
    # branches before sync. Requires commitServer enabled below + a write-scoped
    # repo secret labeled argocd.argoproj.io/secret-type=repository-write.
    hydrator.enabled: "true"

commitServer:
  enabled: true

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false

crds:
  install: true
  keep: true

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicas: 1
