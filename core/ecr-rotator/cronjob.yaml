# Refreshes the `ecr-pull` docker-registry Secret in apps-{dev,staging,prod}.
# ECR auth tokens last 12h; cron at 8h gives a 4h grace window before expiry.
#
# alpine/k8s ships both aws-cli and kubectl in one multi-arch image (amd64
# + arm64), so we get away with a single container.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-pull-rotator
  namespace: ecr-rotator
spec:
  schedule: "0 */8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: ecr-rotator
          restartPolicy: OnFailure
          containers:
            - name: rotate
              image: alpine/k8s:1.31.4
              env:
                - name: AWS_REGION
                  value: "ap-southeast-1"
                - name: AWS_ACCOUNT_ID
                  value: "696085047789"
                - name: TARGET_NAMESPACES
                  value: "apps-dev apps-staging apps-prod"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_SECRET_ACCESS_KEY
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  TOKEN="$(aws ecr get-login-password --region "$AWS_REGION")"
                  SERVER="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                  echo "token-bytes=$(printf '%s' "$TOKEN" | wc -c)"
                  for ns in $TARGET_NAMESPACES; do
                    echo "==> $ns"
                    kubectl -n "$ns" create secret docker-registry ecr-pull \
                      --docker-server="$SERVER" \
                      --docker-username=AWS \
                      --docker-password="$TOKEN" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  done
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
