# Vault Secrets Operator (VSO) — watches VaultStaticSecret / VaultDynamicSecret /
# VaultPKISecret CRDs in app namespaces and materializes them to native K8s
# Secrets. Pods consume those Secrets the normal way (envFrom etc.) — VSO is
# completely transparent to application Deployments.
#
# We don't use VSO's webhook-based mutating injection (that's the older
# `vault-agent-injector` model); VSO is the modern "sync to a real Secret" path.

controller:
  manager:
    image:
      repository: hashicorp/vault-secrets-operator
      tag: "0.10.0"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  replicas: 1
