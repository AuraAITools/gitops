# ServiceAccount + ClusterRoleBinding for Vault's Kubernetes auth method.
#
# When Vault validates a pod's ServiceAccount token, it calls k8s API's
# TokenReview endpoint. To do that, Vault itself needs a SA token with the
# `system:auth-delegator` ClusterRole. This SA is the "delegate" — we hand
# its JWT to Vault via `vault write auth/kubernetes/config token_reviewer_jwt=...`.
#
# The actual token-passing is documented in README's Managing secrets section
# (imperative step run after VSO + Vault are both Healthy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth-delegator
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth-delegator
    namespace: vault
