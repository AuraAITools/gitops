apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spicedb-dev
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    # Wave 8 — alongside keycloak. Needs spicedb-operator (wave 5) CRDs and
    # VSO (wave 5) CRDs present. report-ms (wave 9) reaches SpiceDB at
    # `spicedb.apps-dev.svc:50051`.
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: apps
  sourceHydrator:
    drySource:
      repoURL: https://github.com/AuraAITools/gitops.git
      targetRevision: main
      path: apps/spicedb/overlays/dev
    syncSource:
      targetBranch: environments/dev
      path: apps/spicedb/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
