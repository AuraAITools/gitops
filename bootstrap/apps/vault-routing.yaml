apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-routing
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    # Wave 5 — same as vault itself; VirtualService can be applied before the
    # backend Service exists, Istio will just have no upstream until vault is up.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/AuraAITools/gitops.git
    targetRevision: main
    path: core/vault/routing
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
