apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aura-report-website-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: apps
  sourceHydrator:
    drySource:
      repoURL: https://github.com/AuraAITools/gitops.git
      targetRevision: main
      path: apps/aura-report-website/overlays/prod
    syncSource:
      targetBranch: environments/prod
      path: apps/aura-report-website/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
