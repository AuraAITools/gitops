apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali-routing
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    # Wave 5 — same as kiali itself. VirtualService can be applied before the
    # Service exists; Istio just has no upstream until then.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/AuraAITools/gitops.git
    targetRevision: main
    path: core/kiali/routing
  destination:
    server: https://kubernetes.default.svc
    namespace: kiali
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
