apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aura-report-website-dev
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    # Wave 10 — the BFF proxies report-ms and redirects users to Keycloak,
    # so both have to be Healthy before this comes up cleanly.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: apps
  sourceHydrator:
    drySource:
      repoURL: https://github.com/AuraAITools/gitops.git
      targetRevision: main
      path: apps/aura-report-website/overlays/dev
    syncSource:
      targetBranch: environments/dev
      path: apps/aura-report-website/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
