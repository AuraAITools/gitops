apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-aura-staging
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: apps
  sourceHydrator:
    drySource:
      repoURL: https://github.com/AuraAITools/gitops.git
      targetRevision: main
      path: apps/postgres-aura/overlays/staging
    syncSource:
      targetBranch: environments/staging
      path: apps/postgres-aura/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
