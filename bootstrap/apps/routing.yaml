apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routing
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    # Same wave as argocd-routing; both install Gateway/VirtualService objects
    # after istiod (wave 1) and the ingress gateway pods (wave 2) are Healthy.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/AuraAITools/gitops.git
    targetRevision: main
    path: core/routing
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
