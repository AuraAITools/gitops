apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-routing
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    # Wave 4 — same as kube-prometheus-stack itself. VirtualService can be
    # applied before the Service exists; Istio just has no upstream until then.
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/AuraAITools/gitops.git
    targetRevision: main
    path: core/monitoring/routing
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
