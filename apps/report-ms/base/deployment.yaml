apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-ms
  labels:
    app: report-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-ms
  template:
    metadata:
      labels:
        app: report-ms
    spec:
      serviceAccountName: report-ms
      imagePullSecrets:
        - name: ecr-pull
      initContainers:
        # Runs Liquibase migrations to completion before report-ms starts.
        # Kubelet blocks the main container until this exits 0. Re-runs on
        # every pod start (restart, scale-up, node failure, image bump) —
        # Liquibase's DATABASECHANGELOGLOCK table handles concurrency if
        # multiple replicas start simultaneously.
        - name: db-migrator
          image: 696085047789.dkr.ecr.ap-southeast-1.amazonaws.com/aura:database-runner
          imagePullPolicy: Always
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-aura-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-aura-app
                  key: password
            - name: DB_URL
              value: "jdbc:postgresql://postgres-aura-rw:5432/aura"
            - name: SPRING_PROFILES_ACTIVE
              value: "migration"
          resources:
            requests:
              cpu: 200m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 600Mi
      containers:
        - name: report-ms
          image: 696085047789.dkr.ecr.ap-southeast-1.amazonaws.com/aura:report-ms
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Non-sensitive constants (KEYCLOAK_CLIENT_ID, AURA_EMAIL_FROM_ADDRESS,
            # AWS_REGION, SPICEDB_TARGET, etc.) — overlay patches what differs per env.
            - configMapRef:
                name: report-ms-config
            # KEYCLOAK_CLIENT_SECRET, KEYCLOAK_CLIENT_UUID, SPICEDB_PRESHARED_KEY,
            # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, MAIL_PASSWORD — materialized
            # by VSO from Vault path `aura/<env>/report-ms`. See README "Managing
            # secrets" for the chain (Vault → VaultStaticSecret → K8s Secret).
            - secretRef:
                name: report-ms-secrets
          env:
            # DB connection — username + password come from CNPG's auto-generated
            # postgres-aura-app Secret in the same namespace. URL stays static
            # because the rw service has the same name in every apps-<env> ns.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-aura-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-aura-app
                  key: password
            - name: DB_URL
              value: "jdbc:postgresql://postgres-aura-rw:5432/aura"
            # JVM defaults heap to ~25% of container limit. Spring Boot 4 + Hibernate
            # GC-thrashes through bean init at ~256MB. 75% gives ~1.5GiB heap of the
            # 2Gi limit and cuts startup time noticeably.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=50"
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
          # Startup probe gates the other two — kubelet runs ONLY this until it
          # succeeds, then switches to readiness/liveness. failureThreshold * periodSeconds
          # = 40 * 5 = 200s of startup runway. Spring takes ~140s; this leaves slack.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
