apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - virtualservice.yaml
  - vaultauth.yaml
  - vaultstaticsecret.yaml
namespace: apps-prod

patches:
  - target:
      kind: ConfigMap
      name: report-ms-config
    patch: |
      - op: add
        path: /data/AWS_S3_BUCKET_NAME
        value: "aura-prod"
      - op: add
        path: /data/KEYCLOAK_CLIENT_SERVER_URL
        value: "https://accounts.auraenterprise.solutions"
      - op: add
        path: /data/JWK_SET_URI
        value: "https://accounts.auraenterprise.solutions/realms/aura/protocol/openid-connect/certs"
  - target:
      kind: Deployment
      name: report-ms
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
# TODO: bump replicas + tighten resource limits once we have actual prod load shape.
