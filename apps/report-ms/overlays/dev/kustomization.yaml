apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - virtualservice.yaml
  - vaultauth.yaml
  - vaultstaticsecret.yaml
namespace: apps-dev

patches:
  # Per-env: S3 bucket + Keycloak public URLs. ConfigMap merge — base data is preserved.
  - target:
      kind: ConfigMap
      name: report-ms-config
    patch: |
      - op: add
        path: /data/AWS_S3_BUCKET_NAME
        value: "aura-ap-southeast-dev"
      - op: add
        path: /data/KEYCLOAK_CLIENT_SERVER_URL
        value: "https://accounts-dev.auraenterprise.solutions"
      - op: add
        path: /data/JWK_SET_URI
        value: "https://accounts-dev.auraenterprise.solutions/realms/aura/protocol/openid-connect/certs"
