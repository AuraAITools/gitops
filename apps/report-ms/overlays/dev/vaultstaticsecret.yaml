# Pulls secrets from Vault at aura/dev/report-ms (KV-v2) and writes them to
# a normal K8s Secret named `report-ms-secrets`. The Deployment's
# `envFrom: secretRef: name: report-ms-secrets` consumes it transparently —
# same shape as before, but no more imperative `kubectl create secret`.
#
# rolloutRestartTargets: when the Secret content changes (rotation in Vault),
# VSO triggers a rollout of the report-ms Deployment so the new values land
# in pod env. Without this, pods keep running with stale env vars.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: report-ms-secrets
spec:
  vaultAuthRef: report-ms
  mount: aura
  type: kv-v2
  path: dev/report-ms
  destination:
    name: report-ms-secrets
    create: true
  refreshAfter: 60s
  rolloutRestartTargets:
    - kind: Deployment
      name: report-ms
