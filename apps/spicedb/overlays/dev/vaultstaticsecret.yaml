apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: spicedb-secrets
spec:
  vaultAuthRef: spicedb
  mount: aura
  type: kv-v2
  path: dev/spicedb
  destination:
    name: spicedb-secrets
    create: true
  refreshAfter: 60s
  # No rolloutRestartTargets — the SpiceDB Deployment is operator-managed,
  # and the operator already reconciles on Secret changes (it watches the
  # Secret referenced by SpiceDBCluster.spec.secretName).
