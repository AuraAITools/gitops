apiVersion: authzed.com/v1alpha1
kind: SpiceDBCluster
metadata:
  # Name `spicedb` keeps report-ms's SPICEDB_TARGET=spicedb:50051 valid
  # (the operator names the Service after metadata.name).
  name: spicedb
spec:
  # Operator pulls the SpiceDB image from the `stable` channel by default.
  # Pin a concrete version once we've validated dev. See:
  # https://github.com/authzed/spicedb/releases
  channel: stable

  config:
    # Postgres backend — schema + relationships survive pod restarts.
    # Datastore lives in the CNPG cluster `postgres-spicedb` (apps/postgres-spicedb/);
    # connection string is written to Vault `aura/dev/spicedb` as `datastore_uri`
    # and materialized into `spicedb-secrets` by VSO. The operator runs the
    # `spicedb datastore migrate head` Job on first reconcile.
    datastoreEngine: postgres
    logLevel: info

  # Materialized by VSO from Vault path `aura/dev/spicedb`.
  # Required keys: `preshared_key` AND `datastore_uri`.
  secretName: spicedb-secrets
