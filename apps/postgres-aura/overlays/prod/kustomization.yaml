apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: apps-prod
patches:
  - target:
      kind: Cluster
      name: postgres-aura
    patch: |
      - op: replace
        path: /spec/storage/size
        value: 10Gi
      - op: replace
        path: /spec/instances
        value: 2
# TODO: enable backup to S3/MinIO before any real prod use.
