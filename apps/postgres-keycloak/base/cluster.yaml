apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-keycloak
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak

  postgresql:
    parameters:
      shared_buffers: "128MB"

  # Inherited by all CNPG-managed resources (pods + services + secrets).
  # The istio inject=false annotation only matters on pods; harmless elsewhere.
  inheritedMetadata:
    annotations:
      sidecar.istio.io/inject: "false"

  monitoring:
    enablePodMonitor: true

  storage:
    size: 1Gi   # overridden per env
