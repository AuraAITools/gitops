apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - virtualservice.yaml
  - vaultauth.yaml
  - vaultstaticsecret.yaml
namespace: apps-dev

patches:
  # Per-env URLs. All public hostnames — browsers redirect/fetch through them.
  - target:
      kind: ConfigMap
      name: bff-config
    patch: |
      - op: add
        path: /data/NEXTAUTH_URL
        value: "https://app-dev.auraenterprise.solutions"
      - op: add
        path: /data/KEYCLOAK_ISSUER
        value: "https://accounts-dev.auraenterprise.solutions/realms/aura"
      - op: add
        path: /data/REPORT_SERVICE_URL
        value: "https://api-dev.auraenterprise.solutions"
