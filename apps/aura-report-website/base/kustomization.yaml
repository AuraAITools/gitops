apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
# `bff-secrets` is materialized by VSO from a VaultStaticSecret CRD in each
# overlay. Pulls AUTH_SECRET + KEYCLOAK_CLIENT_SECRET from Vault at
# aura/<env>/bff. See README's Managing secrets section.
