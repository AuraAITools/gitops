apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-spicedb
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:18.0

  bootstrap:
    initdb:
      database: spicedb
      owner: spicedb

  postgresql:
    parameters:
      shared_buffers: "128MB"
      # SpiceDB's postgres datastore engine requires WAL commit timestamps
      # to read changefeed for cache invalidation.
      track_commit_timestamp: "on"

  # Inherited by all CNPG-managed resources (pods + services + secrets).
  # The istio inject=false annotation only matters on pods; harmless elsewhere.
  inheritedMetadata:
    annotations:
      sidecar.istio.io/inject: "false"

  monitoring:
    enablePodMonitor: true

  storage:
    size: 1Gi   # overridden per env
