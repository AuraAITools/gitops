apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - virtualservice.yaml
namespace: apps-dev

patches:
  # Per-env hostname. http:// for now — flip to https:// once cert-manager + TLS
  # at the Istio gateway land. KC_HOSTNAME is the URL browsers see; Keycloak
  # listens on plain :8080 inside the cluster.
  - target:
      kind: Deployment
      name: keycloak
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME
          value: "http://accounts-dev.lab.lan"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME_ADMIN
          value: "http://admin-accounts-dev.lab.lan"
