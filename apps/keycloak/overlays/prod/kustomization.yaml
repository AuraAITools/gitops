apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - virtualservice.yaml
namespace: apps-prod

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME
          value: "http://accounts.lab.lan"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_HOSTNAME_ADMIN
          value: "http://admin-accounts.lab.lan"
      # Slightly more headroom in prod.
      - op: replace
        path: /spec/replicas
        value: 1
# TODO: bump to replicas: 2 once Keycloak's cache config supports multi-instance
# on this cluster (needs Infinispan stack / JGroups discovery setup).
# TODO: strip seeded users from realm-import before any real prod use.
